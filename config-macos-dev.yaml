# Hop macOS Development Config
# Minimal config - everything else uses smart defaults!

cluster:
  name: "haas-prod"

# Optional: lock backend voor leader election.
# Geen lock-blok = standalone (in-memory, single-node).
#
# Optie A: hoplockserver (de simpele, gratis route)
# lock:
#   type: "hoplockserver"           # ook de default als type leeg is
#   url: "https://server-lock.haas.software"
#   api_key: "..."                   # optioneel: X-API-Key header
#   key: "leases/haas-prod"          # optioneel: default = "leases/<cluster.name>"
#
# Optie B: echte S3-compatible store (AWS S3, R2, MinIO, B2, Tigris, ...)
# lock:
#   type: "s3"
#   s3:
#     endpoint: "https://s3.us-east-1.amazonaws.com"
#     bucket: "haas-leases"
#     region: "us-east-1"
#     access_key_id: "AKIA..."
#     secret_access_key: "..."
#     session_token: ""              # optioneel, voor STS temp creds
#     use_path_style: false          # true voor MinIO/B2; false (default) voor AWS/R2

# Optional: Override for dev (disable isolation for easier debugging)
# runner:
#   isolate: false

# Everything else auto-detected:
# - node.ip: auto-detected from outbound interface
# - node.port: 8080 (default)
# - capacity: auto-detected from system (CPU cores, RAM)
# - paths: ./data/* (clean defaults)
# - leader.port: 9080 (port+1000)
# - timeouts: sensible defaults
