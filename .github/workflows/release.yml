name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build all platforms
        run: |
          VERSION="${GITHUB_REF_NAME}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          PLATFORMS="linux:amd64 linux:arm64 darwin:arm64"
          BINS="agent:agent run:cli"

          mkdir -p dist

          for plat in $PLATFORMS; do
            IFS=: read -r os arch <<< "$plat"
            dir="dist/hop-${VERSION}-${os}-${arch}"
            mkdir -p "$dir"

            for b in $BINS; do
              IFS=: read -r bin cmd <<< "$b"
              echo "Building $bin for $os/$arch..."
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags="$LDFLAGS" -o "$dir/$bin" "./cmd/$cmd"
            done

            tar czf "${dir}.tar.gz" -C dist "$(basename $dir)"

            # Same bytes under a version-less name. GitHub's
            # /releases/latest/download/<file> only resolves for a filename that
            # is constant across releases, and gethop.org links exactly that so
            # the download page never goes stale. The versioned name stays for
            # anyone pinning a release.
            cp "${dir}.tar.gz" "dist/hop-${os}-${arch}.tar.gz"

            rm -rf "$dir"
          done

          cd dist && shasum -a 256 *.tar.gz > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
