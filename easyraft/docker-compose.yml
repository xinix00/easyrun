services:
  raft1:
    build: .
    ports:
      - "8081:8080"
    volumes:
      - ./config/raft1.yaml:/etc/easyraft/config.yaml:ro
    networks:
      - raft-net

  raft2:
    build: .
    ports:
      - "8082:8080"
    volumes:
      - ./config/raft2.yaml:/etc/easyraft/config.yaml:ro
    networks:
      - raft-net

  raft3:
    build: .
    ports:
      - "8083:8080"
    volumes:
      - ./config/raft3.yaml:/etc/easyraft/config.yaml:ro
    networks:
      - raft-net

networks:
  raft-net:
    driver: bridge
